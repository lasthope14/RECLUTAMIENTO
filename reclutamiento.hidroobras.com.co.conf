<VirtualHost *:80>
    ServerName reclutamiento.hidroobras.com.co
    DocumentRoot "/srv/www/htdocs/PostulacionesHO/backend/public"
    php_admin_flag expose_php Off

    ErrorLog /var/log/apache2/reclutamiento_error.log
    CustomLog /var/log/apache2/reclutamiento_access.log combined

    <Directory "/srv/www/htdocs/PostulacionesHO/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
